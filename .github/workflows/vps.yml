name: Temporary VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: System information
        run: |
          echo "=== SYSTEM ==="
          uname -a
          echo "=== CPU ==="
          nproc
          echo "=== MEMORY ==="
          free -h
          echo "=== DISK ==="
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            jq \
            python3 \
            python3-pip \
            nodejs \
            npm

      - name: Prepare VPS workspace
        run: |
          mkdir -p "$HOME/vps-data"
          mkdir -p "$HOME/tools"
          echo "Workspace ready"

      - name: Network information
        run: |
          echo "=== NETWORK ==="
          echo "Public IP:"
          curl -4 -s https://api.ipify.org
          echo
          echo "Hostname:"
          hostname

      - name: VPS ready
        run: |
          echo "================================"
          echo " Temporary Linux environment READY"
          echo "================================"
          echo "User: $(whoami)"
          echo "Home: $HOME"
          echo "CPU: $(nproc)"
          echo "IP: $(curl -4 -s https://api.ipify.org)"
          echo "================================"

      - name: Keep session alive
        run: |
          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] VPS alive"
            sleep 60
          done
