name: Temporary VPS

on:
  workflow_dispatch:

jobs:

  vps:
    name: Temporary Linux VPS
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:

      - name: System information
        run: |
          echo "================================="
          echo "Temporary VPS started"
          echo "================================="

          echo "Hostname:"
          hostname

          echo "Kernel:"
          uname -a

          echo "CPU:"
          nproc

          echo "Memory:"
          free -h

          echo "Disk:"
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            jq \
            python3 \
            python3-pip \
            nodejs \
            npm

      - name: Prepare environment
        run: |
          mkdir -p "$HOME/vps-data"

          cat > "$HOME/vps-data/README.txt" <<'EOF'
Temporary GitHub Actions VPS

This environment is temporary.
Data should not be considered persistent.
EOF

      - name: VPS information
        run: |
          echo
          echo "========== VPS INFO =========="
          echo "User:"
          whoami

          echo
          echo "Home:"
          echo "$HOME"

          echo
          echo "IP:"
          curl -4 -s https://api.ipify.org || true

          echo
          echo

      - name: Keep session alive
        run: |
          echo "VPS đang hoạt động."

          while true; do
            echo "[$(date)] VPS alive"
            sleep 60
          done

