name: Temporary VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: System information
        run: |
          echo "=== SYSTEM ==="
          uname -a
          echo "=== CPU ==="
          nproc
          echo "=== MEMORY ==="
          free -h
          echo "=== DISK ==="
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            jq \
            python3 \
            python3-pip \
            nodejs \
            npm

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare workspace
        run: |
          mkdir -p "$HOME/vps-data"
          mkdir -p "$HOME/tools"

      - name: VPS information
        run: |
          echo "================================"
          echo " Temporary Linux environment READY"
          echo "================================"
          echo "User: $(whoami)"
          echo "Home: $HOME"
          echo "CPU: $(nproc)"
          echo "IP: $(curl -4 -s https://api.ipify.org)"
          echo "Node: $(node --version)"
          echo "Python: $(python3 --version)"
          echo "================================"

      - name: Start secure temporary SSH
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
